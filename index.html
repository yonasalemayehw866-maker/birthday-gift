<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ለህሌኒ 🎂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;

      background: linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3,
        #a18cd1
      );
    }

    .container {
      width: 90%;
      max-width: 450px;
      padding: 35px 20px;

      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);

      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .gift {
      font-size: 90px;
      animation: bounce 1.5s infinite;
    }

    h1 {
      font-size: 30px;
      margin: 20px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      border: none;
      padding: 15px 25px;

      border-radius: 30px;

      font-size: 18px;
      font-weight: bold;

      background: white;
      color: #ff4f81;

      cursor: pointer;

      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

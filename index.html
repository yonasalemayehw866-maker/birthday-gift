<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ለህሌኒ 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  text-align: center;
  color: #fff;
}

.container {
  width: 90%;
  max-width: 450px;
  padding: 35px 20px;
  background: rgba(255,255,255,0.18);
  border-radius: 25px;
  backdrop-filter: blur(10px);
}

.gift {
  font-size: 100px;
  animation: bounce 1.5s infinite;
}

h1 {
  font-size: 32px;
}

button {
  border: none;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 18px;
  background: white;
  color: #ff4f81;
  cursor: pointer;
  font-weight: bold;
}

#message {
  display: none;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
</style>
</head>

<body>

<div class="container" id="start">
  <div class="gift">🎁</div>
  <h1>ለህሌኒ ❤️</h1>
  <p>አንድ ትንሽ ስጦታ አለልሽ...</p>
  <button onclick="openGift()">ስጦታውን ክፈቺ 🎁</button>
</div>

<div class="container" id="message">
  <div class="gift">🎂</div>
  <h1>መልካም ልደት ህሌኒ! 🎉</h1>
  <p>
    ይህ ትንሽ ስጦታ ፈገግ እንድትይ ብዬ
